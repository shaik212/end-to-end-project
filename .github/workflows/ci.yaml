name: CI
on:
  push:
    branches:
      - devops-from-scratch

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [payment, shipping, email, checkout]
    steps:
      - uses: actions/checkout@v3
      - name: build ${{ matrix.service }} image
        run: docker build -t ${{ matrix.service }}:local -f src/${{ matrix.service }}/Dockerfile .  