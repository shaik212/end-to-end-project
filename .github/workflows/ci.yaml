name: CI
on:
  push:
    branches:
      - devops-from-scratch

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [payment, shipping, email, checkout]
    steps:
      - uses: actions/checkout@v3
      - name: build ${{ matrix.service }} image
        run: docker build -t ${{ matrix.service }}:local -f src/${{ matrix.service }}/Dockerfile .  
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1
      - name: Tag and push ${{ matrix.service }} image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build -t $ECR_REGISTRY/devops/${{ matrix.service }}:${{ github.sha }} -f src/${{ matrix.service }}/Dockerfile .
          docker push $ECR_REGISTRY/devops/${{ matrix.service }}:${{ github.sha }}